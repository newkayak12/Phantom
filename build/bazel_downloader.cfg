# https://bazel.build/reference/command-line-reference#common_options-flag--downloader_config

# allow list:
allow bcr.bazel.build
allow cache-redirector.jetbrains.com
# e.g. https://cdn.azul.com/zulu/bin/zulu17.50.19-ca-jdk17.0.11-macosx_aarch64.tar.gz
allow cdn.azul.com
# e.g. https://dl.google.com/android/maven2/androidx/collection/collection-jvm/1.5.0/collection-jvm-1.5.0.jar
allow dl.google.com
allow mirror.bazel.build
allow packages.jetbrains.team
# e.g. https://pypi.org/simple/idna/
allow pypi.org
allow go.dev
allow download.jetbrains.com

# phantom-idea: open-source artifacts come straight from their origin, not through JetBrains' download proxy
allow repo1.maven.org
allow maven.google.com
allow repo.gradle.org
allow services.gradle.org
allow github.com
allow raw.githubusercontent.com
allow registry.npmjs.org
allow nodejs.org
allow files.pythonhosted.org
allow static.rust-lang.org
allow static.crates.io
allow index.crates.io
allow www.nuget.org
allow nuget.org
allow releases.hashicorp.com
allow musl.libc.org
allow sourceforge.net
allow gitlab.arm.com
allow android.googlesource.com
allow commondatastorage.googleapis.com
allow ftpmirror.gnu.org
allow cpan.metacpan.org
allow gitlab.freedesktop.org
allow download.visualstudio.microsoft.com
allow cosmo.zip
# phantom-idea: GitHub release assets of newkayak12/phantom-libs (github.com redirects there)
allow release-assets.githubusercontent.com
allow objects.githubusercontent.com

# rewrite list:
rewrite ^swcdn\.apple\.com/(.*)$ https://packages.jetbrains.team/files/p/ij/swcdn-apple-com-mirror/$1

# phantom-idea: URLs in lib/MODULE.bazel and elsewhere still name cache-redirector.jetbrains.com/<origin>/...; fetch them from
# <origin> directly. The bytes are the same (the proxy only caches), so the pinned sha256 values still match. JetBrains-hosted
# artifacts (packages.jetbrains.team, intellij-jbr, intellij-dependencies) have no other origin and keep the proxy.
rewrite ^cache-redirector\.jetbrains\.com/(repo1\.maven\.org|dl\.google\.com|maven\.google\.com|repo\.gradle\.org|services\.gradle\.org|github\.com|raw\.githubusercontent\.com|registry\.npmjs\.org|nodejs\.org|files\.pythonhosted\.org|static\.rust-lang\.org|static\.crates\.io|index\.crates\.io|www\.nuget\.org|nuget\.org|releases\.hashicorp\.com|musl\.libc\.org|sourceforge\.net|gitlab\.arm\.com|android\.googlesource\.com|commondatastorage\.googleapis\.com|ftpmirror\.gnu\.org|cpan\.metacpan\.org|gitlab\.freedesktop\.org|download\.visualstudio\.microsoft\.com|cosmo\.zip)/(.*)$ https://$1/$2
# phantom-idea: JetBrains publishes the rd libraries (com.jetbrains.rd) to Maven Central too; every one pinned in lib/MODULE.bazel
# has the same sha256 there, so fetch them from Maven Central instead of packages.jetbrains.team.
rewrite ^(cache-redirector\.jetbrains\.com/)?packages\.jetbrains\.team/maven/p/ij/intellij-dependencies/(com/jetbrains/rd/.*)$ https://repo1.maven.org/maven2/$2
# phantom-idea: open-source libraries the app ships that only JetBrains hosts are mirrored, unmodified, as release assets of
# github.com/newkayak12/phantom-libs (tag jetbrains-hosted-1; SOURCES.csv there lists each file). Only the file names listed
# here are redirected; every other packages.jetbrains.team artifact is untouched.
rewrite ^(cache-redirector\.jetbrains\.com/)?packages\.jetbrains\.team/maven/p/[^/]+/[^/]+/(?:[^/]+/)+(ap-validation-all-1\.0\.229-sources\.jar|ap-validation-all-1\.0\.229\.jar|asm-all-9\.6\.1-sources\.jar|asm-all-9\.6\.1\.jar|batik-anim-1\.16\.0-35-sources\.jar|batik-anim-1\.16\.0-35\.jar|batik-awt-util-1\.16\.0-35-sources\.jar|batik-awt-util-1\.16\.0-35\.jar|batik-bridge-1\.16\.0-35-sources\.jar|batik-bridge-1\.16\.0-35\.jar|batik-constants-1\.16\.0-35-sources\.jar|batik-constants-1\.16\.0-35\.jar|batik-css-1\.16\.0-35-sources\.jar|batik-css-1\.16\.0-35\.jar|batik-dom-1\.16\.0-35-sources\.jar|batik-dom-1\.16\.0-35\.jar|batik-ext-1\.16\.0-35-sources\.jar|batik-ext-1\.16\.0-35\.jar|batik-gvt-1\.16\.0-35-sources\.jar|batik-gvt-1\.16\.0-35\.jar|batik-parser-1\.16\.0-35-sources\.jar|batik-parser-1\.16\.0-35\.jar|batik-svg-dom-1\.16\.0-35-sources\.jar|batik-svg-dom-1\.16\.0-35\.jar|batik-svggen-1\.16\.0-35-sources\.jar|batik-svggen-1\.16\.0-35\.jar|batik-transcoder-1\.16\.0-35-sources\.jar|batik-transcoder-1\.16\.0-35\.jar|batik-util-1\.16\.0-35-sources\.jar|batik-util-1\.16\.0-35\.jar|batik-xml-1\.16\.0-35-sources\.jar|batik-xml-1\.16\.0-35\.jar|commons-imaging-1\.0-RC-1-sources\.jar|commons-imaging-1\.0-RC-1\.jar|download-pgp-verifier-1\.1\.4-sources\.jar|download-pgp-verifier-1\.1\.4\.jar|fus-api-1\.0\.229-sources\.jar|fus-api-1\.0\.229\.jar|gradle-api-9\.6\.0-sources\.jar|gradle-api-9\.6\.0\.jar|ini4j-0\.5\.5-2-sources\.jar|ini4j-0\.5\.5-2\.jar|intellij-deps-fastutil-8\.5\.18-jb1-sources\.jar|intellij-deps-fastutil-8\.5\.18-jb1\.jar|intellij-deps-java-atk-wrapper-263\.33-sources\.jar|intellij-deps-java-atk-wrapper-263\.33\.jar|java-compatibility-1\.0\.1-sources\.jar|java-compatibility-1\.0\.1\.jar|jb-jdi-2\.45-sources\.jar|jb-jdi-2\.45\.jar|jcef-144\.0\.15-g72717cf-chromium-144\.0\.7559\.172-api-1\.21-262-b37-sources\.jar|jcef-144\.0\.15-g72717cf-chromium-144\.0\.7559\.172-api-1\.21-262-b37\.jar|jediterm-core-3\.73-sources\.jar|jediterm-core-3\.73\.jar|jediterm-ui-3\.73-sources\.jar|jediterm-ui-3\.73\.jar|jps-javac-extension-10\.jar|jvm-native-trusted-roots-1\.1\.7-sources\.jar|jvm-native-trusted-roots-1\.1\.7\.jar|native-3\.42\.0-jb\.1\.jar|ngram-slp-0\.0\.3-sources\.jar|ngram-slp-0\.0\.3\.jar|org\.eclipse\.jgit-6\.6\.1\.202309021850-r-jb-202510311356-sources\.jar|org\.eclipse\.jgit-6\.6\.1\.202309021850-r-jb-202510311356\.jar|sa-jdwp-1\.25-sources\.jar|sa-jdwp-1\.25\.jar|skiko-awt-runtime-all-0\.150\.1-sources\.jar|skiko-awt-runtime-all-0\.150\.1\.jar|sshj-0\.38\.0-idea2-sources\.jar|sshj-0\.38\.0-idea2\.jar|tips-intellij-idea-community-241\.62\.jar|trove4j-1\.0\.20221201-sources\.jar|trove4j-1\.0\.20221201\.jar|winp-1\.30\.1\.jar)$ https://github.com/newkayak12/phantom-libs/releases/download/jetbrains-hosted-1/$2
# phantom-idea: four more, Apache-2.0 by source header or upstream repository (tag jetbrains-hosted-2).
rewrite ^(cache-redirector\.jetbrains\.com/)?packages\.jetbrains\.team/maven/p/[^/]+/[^/]+/(?:[^/]+/)+(debugger-agent-1\.193-sources\.jar|debugger-agent-1\.193\.jar|debugger-memory-agent-1\.0\.51-sources\.jar|debugger-memory-agent-1\.0\.51\.jar|rwmutex-idea-0\.0\.10-sources\.jar|rwmutex-idea-0\.0\.10\.jar|serviceMessages-2024\.07-sources\.jar|serviceMessages-2024\.07\.jar)$ https://github.com/newkayak12/phantom-libs/releases/download/jetbrains-hosted-2/$2
# phantom-idea: JCEF 150 (moved from 144 for Chromium security fixes), tag jetbrains-hosted-3.
rewrite ^(cache-redirector\.jetbrains\.com/)?packages\.jetbrains\.team/maven/p/[^/]+/[^/]+/(?:[^/]+/)+(jcef-150\.0\.14-g7c1aa68-chromium-150\.0\.7871\.129-api-1\.21-263-b21-sources\.jar|jcef-150\.0\.14-g7c1aa68-chromium-150\.0\.7871\.129-api-1\.21-263-b21\.jar)$ https://github.com/newkayak12/phantom-libs/releases/download/jetbrains-hosted-3/$2
# ftp.gnu.org is unreliable; use its mirror (as upstream did through the proxy)
rewrite ^ftp\.gnu\.org/(.*)$ https://ftpmirror.gnu.org/$1

# block by default:
block *
