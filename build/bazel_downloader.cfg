# https://bazel.build/reference/command-line-reference#common_options-flag--downloader_config

# allow list:
allow bcr.bazel.build
allow cache-redirector.jetbrains.com
# e.g. https://cdn.azul.com/zulu/bin/zulu17.50.19-ca-jdk17.0.11-macosx_aarch64.tar.gz
allow cdn.azul.com
# e.g. https://dl.google.com/android/maven2/androidx/collection/collection-jvm/1.5.0/collection-jvm-1.5.0.jar
allow dl.google.com
allow mirror.bazel.build
allow packages.jetbrains.team
# e.g. https://pypi.org/simple/idna/
allow pypi.org
allow go.dev
allow download.jetbrains.com

# phantom-idea: open-source artifacts come straight from their origin, not through JetBrains' download proxy
allow repo1.maven.org
allow maven.google.com
allow repo.gradle.org
allow services.gradle.org
allow github.com
allow raw.githubusercontent.com
allow registry.npmjs.org
allow nodejs.org
allow files.pythonhosted.org
allow static.rust-lang.org
allow static.crates.io
allow index.crates.io
allow www.nuget.org
allow nuget.org
allow releases.hashicorp.com
allow musl.libc.org
allow sourceforge.net
allow gitlab.arm.com
allow android.googlesource.com
allow commondatastorage.googleapis.com
allow ftpmirror.gnu.org
allow cpan.metacpan.org
allow gitlab.freedesktop.org
allow download.visualstudio.microsoft.com
allow cosmo.zip

# rewrite list:
rewrite ^swcdn\.apple\.com/(.*)$ https://packages.jetbrains.team/files/p/ij/swcdn-apple-com-mirror/$1

# phantom-idea: URLs in lib/MODULE.bazel and elsewhere still name cache-redirector.jetbrains.com/<origin>/...; fetch them from
# <origin> directly. The bytes are the same (the proxy only caches), so the pinned sha256 values still match. JetBrains-hosted
# artifacts (packages.jetbrains.team, intellij-jbr, intellij-dependencies) have no other origin and keep the proxy.
rewrite ^cache-redirector\.jetbrains\.com/(repo1\.maven\.org|dl\.google\.com|maven\.google\.com|repo\.gradle\.org|services\.gradle\.org|github\.com|raw\.githubusercontent\.com|registry\.npmjs\.org|nodejs\.org|files\.pythonhosted\.org|static\.rust-lang\.org|static\.crates\.io|index\.crates\.io|www\.nuget\.org|nuget\.org|releases\.hashicorp\.com|musl\.libc\.org|sourceforge\.net|gitlab\.arm\.com|android\.googlesource\.com|commondatastorage\.googleapis\.com|ftpmirror\.gnu\.org|cpan\.metacpan\.org|gitlab\.freedesktop\.org|download\.visualstudio\.microsoft\.com|cosmo\.zip)/(.*)$ https://$1/$2
# phantom-idea: JetBrains publishes the rd libraries (com.jetbrains.rd) to Maven Central too; every one pinned in lib/MODULE.bazel
# has the same sha256 there, so fetch them from Maven Central instead of packages.jetbrains.team.
rewrite ^(cache-redirector\.jetbrains\.com/)?packages\.jetbrains\.team/maven/p/ij/intellij-dependencies/(com/jetbrains/rd/.*)$ https://repo1.maven.org/maven2/$2
# ftp.gnu.org is unreliable; use its mirror (as upstream did through the proxy)
rewrite ^ftp\.gnu\.org/(.*)$ https://ftpmirror.gnu.org/$1

# block by default:
block *
