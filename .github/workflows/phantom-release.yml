# Builds Phantom for Apple silicon and Windows x64 and publishes them as one GitHub release (tag v<YY>.<MM>.<DD>.<N>),
# with Kotlin and Maven released in Phantom-plugins. Jobs:
#   prepare          picks the tag (phantom-release.sh --next-tag), so both builds carry the same version
#   macos            builds the DMG and releases it (tag, release with the DMG and updates.xml, Kotlin and Maven)
#   windows-build    builds the Windows installer and zip at the same time, on a runner of its own, as an artifact
#   windows-publish  adds them to the release once both are done
# A Windows failure never holds back or repeats the macOS release: re-run the failed jobs ("Re-run failed jobs"), or run
# this workflow with windows_tag set to the release tag, which skips prepare and macos and only builds and adds the
# Windows files. A macOS failure publishes nothing, so the Windows build is simply dropped.
#   Actions → Phantom release → Run workflow (optional notes). Not on tag pushes: phantom-release.sh pushes the tag
#   itself, so a tag trigger would build every release twice.
# Runs on GitHub-hosted macOS runners (free for this public repository): macos-15 has 3 cores and 7 GB of memory and
# keeps no Bazel cache, and the DMG alone built from scratch in 70 minutes with 79 GB of disk left (#72). Windows is
# cross-built on macOS. The DMG holds an ad-hoc signed app; phantom-install.sh re-signs it with the
# "Phantom Local" certificate where it is installed, so no signing secret is stored on GitHub.
# Optional secret PHANTOM_PLUGINS_TOKEN (.github/SERVICES.md, Release credentials): a fine-grained token for
# Phantom-plugins only (Contents and Pull requests: write). With it phantom-release.sh also builds Kotlin and Maven,
# releases them there and merges the marketplace.json pull request; without it only Phantom is released (the job's own
# token cannot reach the private Phantom-plugins) and the marketplace keeps the previous Kotlin and Maven.
name: Phantom release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (default: commits since the previous release)"
        required: false
      windows:
        description: "Also build the Windows installer and zip (off: macOS only)"
        type: boolean
        default: true
      windows_tag:
        description: "Only build Windows for this existing release (v<YY>.<MM>.<DD>.<N>); skips the macOS release"
        required: false

permissions:
  contents: write

concurrency:
  group: phantom-release
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.windows_tag == ''
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      day: ${{ steps.tag.outputs.day }}
      seq: ${{ steps.tag.outputs.seq }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Next tag
        id: tag
        run: |
          tag="$(./phantom-release.sh --next-tag)"   # v26.11.23.1
          v="${tag#v}"
          { echo "tag=$tag"; echo "day=$(cut -d. -f1-3 <<< "$v" | tr -d .)"; echo "seq=${v##*.}"; } >> "$GITHUB_OUTPUT"
          echo "::notice::release $tag"

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PHANTOM_PLUGINS_TOKEN: ${{ secrets.PHANTOM_PLUGINS_TOKEN }}
    steps:
      - name: Token
        run: |
          if [[ -z "$PHANTOM_PLUGINS_TOKEN" ]]; then
            echo "::notice::no PHANTOM_PLUGINS_TOKEN: releasing Phantom only, without Kotlin and Maven"
            echo "PHANTOM_RELEASE_PLUGINS=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PHANTOM_RELEASE_PLUGINS=1" >> "$GITHUB_ENV"
          GH_TOKEN="$PHANTOM_PLUGINS_TOKEN" gh api repos/newkayak12/Phantom-plugins --jq '"Phantom-plugins push: \(.permissions.push)"'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release notes list the commits since the previous release tag
          fetch-depth: 200
          fetch-tags: true

      # Xcode versions other than the selected one, Android SDK and .NET: the build needs none of them. The tool cache
      # stays: JAVA_HOME points into it, and Bazel builds gradle-api with that JDK
      - name: Free disk
        run: |
          keep="$(xcode-select -p | sed 's#/Contents/Developer$##')"
          for x in /Applications/Xcode*.app; do [[ "$x" == "$keep" ]] || sudo rm -rf "$x"; done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" || true
          df -h /

      # The build graph still references the Android modules (README, Build from source)
      - name: Android checkout
        run: git clone --depth 1 --branch idea/262.10968.63 https://github.com/JetBrains/android.git android

      # phantom-release.sh publishes Kotlin and marketplace.json through the Phantom-plugins checkout next to this one
      # (the build itself downloads the bundled plugins from phantom-libs); git reaches it with PHANTOM_PLUGINS_TOKEN
      - name: Phantom-plugins checkout
        # an unset variable is null, which equals '0' in an expression: compare with an explicit 1
        if: env.PHANTOM_RELEASE_PLUGINS == '1'
        run: |
          # shellcheck disable=SC2016 # the helper expands the token when git runs it
          git config --global credential.https://github.com/newkayak12/Phantom-plugins.git.helper \
            '!f() { echo username=x-access-token; echo "password=$PHANTOM_PLUGINS_TOKEN"; }; f'
          git clone --depth 50 https://github.com/newkayak12/Phantom-plugins.git "$GITHUB_WORKSPACE/../Phantom-plugins"
          git -C "$GITHUB_WORKSPACE/../Phantom-plugins" log -1 --format='Phantom-plugins %h %s'

      # common.bazelrc plans for twice the cores and 77% of memory; with 7 GB that leaves too little for the build JVM
      - name: Bazel limits
        run: |
          cat > .bazelrc-user.bazelrc <<'EOF'
          common --jobs=HOST_CPUS --worker_max_multiplex_instances=JvmCompile=HOST_CPUS
          common --local_resources=memory=HOST_RAM*.5 --local_resources=cpu=HOST_CPUS
          EOF

      - name: Build and release
        env:
          NOTES: ${{ inputs.notes }}
          DAY: ${{ needs.prepare.outputs.day }}
          SEQ: ${{ needs.prepare.outputs.seq }}
        run: |
          # the marketplace.json commit in the Phantom-plugins worktree
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ( while sleep 600; do echo "[$(date +%H:%M)] $(df -h / | tail -1 | awk '{print "disk free",$4}'); $(memory_pressure | tail -1)"; done ) &
          PHANTOM_WINDOWS=0 PHANTOM_BUILD_DAY="$DAY" PHANTOM_BUILD_SEQ="$SEQ" ./phantom-release.sh

      # a failure after the build (the tag push, the upload) keeps the DMG: download this artifact into
      # out/phantom-idea/artifacts, write its PH- build number to out/phantom-build-number and run
      # ./phantom-release.sh --no-build, instead of building again
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-dmg
          path: |
            out/phantom-idea/artifacts/phantom-*.dmg
            out/phantom-build-number
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

      - name: Disk at the end
        if: always()
        run: df -h /

  windows-build:
    needs: prepare
    # with prepare, or alone for an existing release (windows_tag; prepare is skipped then)
    if: always() && ((needs.prepare.result == 'success' && inputs.windows) || inputs.windows_tag != '')
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TAG: ${{ inputs.windows_tag || needs.prepare.outputs.tag }}
    steps:
      # the commit the macOS job releases (its tag does not exist yet), or the existing release's tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.windows_tag || github.sha }}

      - name: Free disk
        run: |
          keep="$(xcode-select -p | sed 's#/Contents/Developer$##')"
          for x in /Applications/Xcode*.app; do [[ "$x" == "$keep" ]] || sudo rm -rf "$x"; done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" || true
          df -h /

      - name: Android checkout
        run: git clone --depth 1 --branch idea/262.10968.63 https://github.com/JetBrains/android.git android

      - name: Bazel limits
        run: |
          cat > .bazelrc-user.bazelrc <<'EOF'
          common --jobs=HOST_CPUS --worker_max_multiplex_instances=JvmCompile=HOST_CPUS
          common --local_resources=memory=HOST_RAM*.5 --local_resources=cpu=HOST_CPUS
          EOF

      - name: Build Windows
        run: ./phantom-release.sh --windows-build "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            out/phantom-idea/artifacts/phantom-*.exe
            out/phantom-idea/artifacts/phantom-*.win.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Disk at the end
        if: always()
        run: df -h /

  windows-publish:
    needs: [prepare, macos, windows-build]
    # once the macOS release is out (or, with windows_tag, already was) and the Windows build succeeded
    if: always() && needs.windows-build.result == 'success' && (needs.macos.result == 'success' || inputs.windows_tag != '')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.windows_tag || needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: out/phantom-idea/artifacts
      - name: Add Windows to the release
        run: ./phantom-release.sh --windows-upload "$TAG"
