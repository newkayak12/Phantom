name: Gradle Wrappers Validation
# phantom-idea: validate wrapper changes before merge and on the fork's main branch.
on:
  pull_request:
    paths:
      - '**/gradle-wrapper.jar'
      - '.github/workflows/Gradle_wrappers_validation.yml'
  push:
    branches:
      - main
    paths:
      - '**/gradle-wrapper.jar'
      - '.github/workflows/Gradle_wrappers_validation.yml'
permissions:
  contents: read
jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # phantom-idea: pin wrapper-validation dependencies to reviewed commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
