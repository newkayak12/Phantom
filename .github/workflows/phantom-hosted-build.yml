# Trial: can a GitHub-hosted macOS runner build the Phantom DMG? macos-15 has 3 cores, 7 GB of memory and a small disk;
# the README asks for 16 GB and about 120 GB free for a first build, and a hosted runner keeps no Bazel cache between
# runs, so this is expected to fail. It records where: the runner, free disk after each step, and memory and disk every
# 5 minutes during the build. DMG only (no Windows), no release; a built DMG is kept as an artifact for 3 days.
#   Actions → Phantom macOS build (hosted trial) → Run workflow
name: Phantom macOS build (hosted trial)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phantom-hosted-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu
          echo "memory $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          df -h /

      # Xcode versions other than the selected one, Android SDK and .NET: the build needs none of them. The tool cache
      # stays: JAVA_HOME points into it, and Bazel builds gradle-api with that JDK
      - name: Free disk
        run: |
          keep="$(xcode-select -p | sed 's#/Contents/Developer$##')"
          for x in /Applications/Xcode*.app; do [[ "$x" == "$keep" ]] || sudo rm -rf "$x"; done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" || true
          echo "JAVA_HOME=$JAVA_HOME"
          df -h /

      # The build graph still references the Android modules (README, Build from source)
      - name: Android checkout
        run: |
          git clone --depth 1 --branch idea/262.10968.63 https://github.com/JetBrains/android.git android
          df -h /

      # common.bazelrc plans for twice the cores and 77% of memory; with 7 GB that leaves too little for the build JVM
      - name: Bazel limits
        run: |
          cat > .bazelrc-user.bazelrc <<'EOF'
          common --jobs=HOST_CPUS --worker_max_multiplex_instances=JvmCompile=HOST_CPUS
          common --local_resources=memory=HOST_RAM*.5 --local_resources=cpu=HOST_CPUS
          EOF

      - name: Build DMG
        env:
          PHANTOM_WINDOWS: "0"
          PHANTOM_BUILD_SEQ: ${{ github.run_number }}
        run: |
          ( while sleep 300; do echo "[$(date +%H:%M)] $(df -h / | tail -1 | awk '{print "disk used",$3,"free",$4}'); $(memory_pressure | tail -1)"; done ) &
          ./phantom-build.sh

      - name: Disk at the end
        if: always()
        run: |
          df -h /
          du -sh out "$HOME/Library/Caches/JetBrains" 2>/dev/null || true

      - name: Keep the DMG
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-dmg
          path: out/phantom-idea/artifacts/phantom-*-aarch64.dmg
          retention-days: 3
          compression-level: 0
