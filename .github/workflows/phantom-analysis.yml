name: Phantom analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * *'

permissions:
  contents: read

concurrency:
  group: phantom-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /sonar-project.properties
            /codecov.yml
            /phantom-bench-report.py
            /tools/phantom-quality.mjs
            /tools/phantom-quality.test.mjs
            /tools/test-summary.py
            /platform/platform-impl/src/dev/phantom/
            /platform/lang-impl/src/dev/phantom/
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a5914442 # v5.0.0
        with:
          node-version: '22'
      - name: Generate quality-tool coverage
        id: tests
        run: |
          mkdir -p out/phantom-quality-coverage
          node --test --experimental-test-coverage \
            --test-coverage-include=tools/phantom-quality.mjs \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=out/phantom-quality-coverage/lcov.info \
            --test-reporter=junit --test-reporter-destination=out/phantom-quality-coverage/junit.xml \
            tools/phantom-quality.test.mjs
          test -s out/phantom-quality-coverage/lcov.info
      - name: Summarize quality-tool tests
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 tools/test-summary.py 'Quality coverage' --outcome "$TEST_OUTCOME" --reports out/phantom-quality-coverage/junit.xml
      - name: Preserve measured coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phantom-quality-coverage
          path: |
            out/phantom-quality-coverage/lcov.info
            out/phantom-quality-coverage/junit.xml
          if-no-files-found: error
      - name: Report external analysis configuration
        id: services
        env:
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          echo '## External analysis' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage measures tools/phantom-quality.mjs only; no JVM coverage is claimed.' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TRUSTED" == true ]]; then
            missing=()
            for name in CODECOV_TOKEN SONAR_TOKEN SONAR_HOST_URL SONAR_PROJECT_KEY; do
              if [[ -z "${!name}" ]]; then missing+=("$name"); fi
            done
            if [[ "$SONAR_HOST_URL" == *sonarcloud.io* && -z "$SONAR_ORGANIZATION" ]]; then
              missing+=(SONAR_ORGANIZATION)
            fi
            if (( ${#missing[@]} )); then
              echo "::error::Missing analysis configuration: ${missing[*]}"
              exit 1
            fi
          fi
          if [[ "$TRUSTED" == true && -n "$CODECOV_TOKEN" ]]; then
            echo 'codecov=true' >> "$GITHUB_OUTPUT"
          else
            echo 'codecov=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Codecov upload unavailable: configure CODECOV_TOKEN; fork PRs do not receive upload credentials.'
            echo '- Codecov upload **not run**: CODECOV_TOKEN required; credentials withheld for fork PRs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$TRUSTED" == true && -n "$SONAR_TOKEN" && -n "$SONAR_HOST_URL" && -n "$SONAR_PROJECT_KEY" ]]; then
            if [[ "$SONAR_HOST_URL" == *sonarcloud.io* && -z "$SONAR_ORGANIZATION" ]]; then
              echo 'sonar=false' >> "$GITHUB_OUTPUT"
              echo '::warning::SonarQube Cloud analysis unavailable: configure SONAR_ORGANIZATION.'
              echo '- SonarQube Cloud analysis **not run**: SONAR_ORGANIZATION required.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'sonar=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'sonar=false' >> "$GITHUB_OUTPUT"
            echo '::warning::SonarQube analysis unavailable: configure SONAR_TOKEN, SONAR_HOST_URL and SONAR_PROJECT_KEY; fork PRs do not receive credentials.'
            echo '- SonarQube analysis **not run**: SONAR_TOKEN secret and SONAR_HOST_URL/SONAR_PROJECT_KEY variables required; credentials withheld for fork PRs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload measured coverage to Codecov
        if: steps.services.outputs.codecov == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: out/phantom-quality-coverage/lcov.info
          disable_search: true
          # Sparse checkout omits upstream files that Codecov's automatic fixes try to read.
          disable_file_fixes: true
          flags: phantom-quality
          name: phantom-quality
          fail_ci_if_error: true
          cleanup: true
      - name: Limit analysis checkout to Phantom sources
        if: steps.services.outputs.sonar == 'true'
        run: |
          git sparse-checkout set --no-cone \
            '/.gitignore' '/sonar-project.properties' '/phantom-bench-report.py' \
            '/tools/phantom-quality.mjs' '/tools/phantom-quality.test.mjs' \
            '/platform/platform-impl/src/dev/phantom/' \
            '/platform/lang-impl/src/dev/phantom/'
      - name: Fetch source history needed by SonarQube blame
        if: steps.services.outputs.sonar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # JGit cannot lazily fetch historical blobs from the partial clone.
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$header"
          objects="$RUNNER_TEMP/sonar-history-objects"
          missing="$RUNNER_TEMP/sonar-missing-objects"
          GIT_NO_LAZY_FETCH=1 git rev-list --objects --missing=print --all -- \
            .gitignore sonar-project.properties phantom-bench-report.py \
            tools/phantom-quality.mjs tools/phantom-quality.test.mjs \
            platform/platform-impl/src/dev/phantom/ \
            platform/lang-impl/src/dev/phantom/ \
            | awk '{ sub(/^\?/, "", $1); print $1 }' > "$objects"
          # Sonar's changed-file scan reads the .gitattributes of every directory a change touches
          for commit in HEAD $(git for-each-ref --format="%(objectname)" refs/remotes/origin); do
            git ls-tree -r "$commit" | awk '$4 ~ /(^|\/)\.gitattributes$/ { print $3 }'
          done | sort -u >> "$objects"
          GIT_NO_LAZY_FETCH=1 git cat-file --batch-check='%(objectname)' < "$objects" \
            | awk '$2 == "missing" { print $1 }' > "$missing"
          if [[ -s "$missing" ]]; then
            # noop negotiation: with the usual "have" lines GitHub leaves out blobs of commits the clone already has
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" -c fetch.negotiationAlgorithm=noop \
              fetch --no-tags --no-write-fetch-head --filter=blob:none --stdin origin < "$missing"
          fi
          GIT_NO_LAZY_FETCH=1 git cat-file --batch-check='%(objectname)' < "$objects" \
            | awk 'NF != 1 { print "::error::Git history object unavailable: " $0; failed=1 } END { exit failed }'
      - name: Analyze Phantom sources with SonarQube
        if: steps.services.outputs.sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
      - name: Record completed uploads
        env:
          CODECOV: ${{ steps.services.outputs.codecov }}
          SONAR: ${{ steps.services.outputs.sonar }}
        run: |
          if [[ "$CODECOV" == true ]]; then echo '- Codecov upload completed.' >> "$GITHUB_STEP_SUMMARY"; fi
          if [[ "$SONAR" == true ]]; then echo '- SonarQube analysis and quality gate completed.' >> "$GITHUB_STEP_SUMMARY"; fi
