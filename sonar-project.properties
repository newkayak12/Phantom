# Analyze Phantom-owned code only, never the inherited IntelliJ monorepo.
# Host, project key and optional Cloud organization are repository variables.
# Cloud ignores source/test inclusion settings in its new scope mode.
# The workflow uses a sparse checkout to enforce the analysis boundary.
sonar.exclusions=**/tests/**,**/testSrc/**,**/BUILD.bazel,**/*.iml,out/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=out/phantom-quality-coverage/lcov.info
# JVM and Python tests are separate; the LCOV report measures only the Node tool.
sonar.coverage.exclusions=**/*.kt,**/*.py
